<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>智能电子秤</title>
  <style>
    body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #f4f7fb; color: #1c2833; }
    main { max-width: 720px; margin: 32px auto; padding: 0 20px 40px; }
    h1 { margin: 0 0 8px; color: #1f4e79; }
    h2 { margin: 28px 0 8px; font-size: 18px; color: #1f4e79; }
    p { line-height: 1.6; }
    .panel { background: white; border: 1px solid #d0d7de; border-radius: 12px; padding: 16px 20px; }
    .big { font-size: 28px; font-weight: 700; margin: 8px 0; }
    .muted { color: #5b6770; }
  </style>
</head>
<body>
  <main>
    <h1>智能电子秤</h1>
    <p class="muted">电脑上的对照页。正式屏幕是秤上的 TFT，那里只显示商品名、克数和金额。</p>
    <h2>这次模拟的一屏</h2>
    <section class="panel">
      <div>商品名 banana</div>
      <div class="big">326.4 克</div>
      <div class="big">3.92 元</div>
      <p>电脑会念：香蕉，326.4克，3.92元。热量和碳水不念。</p>
      <p>热量 297 千卡，碳水 71.8 克。这两项留在电脑上，不发给板子。</p>
    </section>
    <h2>真秤已经测过</h2>
    <section class="panel">
      <p>2026-10-13，COM4。放稳 220.3 克，金额 2.64 元。当时名字用的是演示香蕉，不是后来这张照片。</p>
    </section>
    <h2>照片</h2>
    <section class="panel">
      <p>香蕉照片已经认出，名字是 banana。贴纸那张没有食物，没有出价。</p>
    </section>
  </main>
</body>
</html>
