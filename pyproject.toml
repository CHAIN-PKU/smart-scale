[project]
name = "smart-scale"
version = "0.1.0"
description = "PC host runtime for the smart scale. Firmware and models plug in behind stable interfaces."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["host"]
include = ["scale_host*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
